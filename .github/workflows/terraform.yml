# Plans Terraform changes on every PR that touches terraform/ and posts the
# plan as a PR comment. On merge to main, re-plans and then waits for manual
# approval (via the "production" GitHub environment) before applying.

name: Terraform

on:
  pull_request:
    branches: [ "main" ]
    paths: [ "terraform/**" ]
  push:
    branches: [ "main" ]
    paths: [ "terraform/**" ]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228897118541:role/food-journal-github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save plan text
        if: steps.plan.outputs.exitcode == '2'
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 5

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const exitcode = "${{ steps.plan.outputs.exitcode }}";
            const noChanges = exitcode === '0';
            const body = noChanges
              ? '<!-- terraform-plan -->\n### Terraform plan\nNo changes.'
              : '<!-- terraform-plan -->\n### Terraform plan\n<details><summary>Show plan</summary>\n\n```hcl\n' +
                fs.readFileSync('terraform/tfplan.txt', 'utf8').slice(0, 60000) +
                '\n```\n</details>';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- terraform-plan -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    name: Terraform apply
    if: github.event_name == 'push' && needs.plan.outputs.exitcode == '2'
    needs: plan
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228897118541:role/food-journal-github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Terraform init
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
